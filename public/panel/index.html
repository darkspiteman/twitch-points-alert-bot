<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitch Alert Bot</title>
<link rel="icon" href="/panel/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/panel/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><img src="/panel/icon.svg" alt=""><span>Alert Bot</span></div>
    <div class="lang-switch" id="lang-switch" role="group" aria-label="Language / Язык"></div>
    <nav>
      <a href="#home" data-page="home">Главная</a>
      <a href="#rewards" data-page="rewards">Награды</a>
      <a href="#media" data-page="media">Медиа</a>
      <a href="#find" data-page="find">Найти медиа</a>
      <a href="#stats" data-page="stats">Статистика</a>
      <a href="#settings" data-page="settings">Настройки</a>
      <a href="#log" data-page="log">Журнал</a>
      <a href="#help" data-page="help">Помощь</a>
      <a href="#support" data-page="support" class="nav-support">❤ Поддержать автора</a>
    </nav>
    <div class="side-status" id="side-status"></div>
  </aside>
  <main id="main">
    <div id="conn-banner" class="banner bad" hidden>Нет связи с ботом. Переподключение…</div>
    <div id="update-bar" class="banner update" hidden></div>
    <section id="page-home" class="page"></section>
    <section id="page-rewards" class="page" hidden></section>
    <section id="page-media" class="page" hidden></section>
    <section id="page-find" class="page" hidden></section>
    <section id="page-stats" class="page" hidden></section>
    <section id="page-settings" class="page" hidden></section>
    <section id="page-log" class="page" hidden></section>
    <section id="page-help" class="page" hidden></section>
    <section id="page-support" class="page" hidden></section>
  </main>
</div>
<div id="toasts"></div>
<script src="/panel/i18n.js"></script>
<script src="/panel/app.js"></script>
</body>
</html>
